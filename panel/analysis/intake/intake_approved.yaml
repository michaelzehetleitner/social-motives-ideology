# intake_approved.yaml — approved intake deletion for the SYNTHETIC raw export
# (data/synthetic/zm_panel_synthetic.csv). AP3, cfg$data_files$intake.
#
# What this file is: the column-approval fixture for one-time intake outside
# targets (scripts/prepare_intake.R). Preparation requires a decision for every
# original column, removes the approved identifiers before persistence, and
# assigns respondent_id as a running number. The pipeline reads only the
# resulting cleaned CSV and verified receipt in data/intake/.
#
# Why it is committed: the synthetic export is generated test data, so its
# approval is not a data-protection decision and can be checked in; it lets
# the pipeline run end to end (ZM_DATA=synthetic). data_source: synthetic
# binds this approval to that export; a run on the real export
# (ZM_DATA=real) needs its own proposal and approval, ruled by MZ.
#
# Decisions: reason delete_always (technical identifiers, timestamps, flow
# fields, consent-info button) and delete_if_present (IP/geolocation and
# contact fields; none present in this export, listed with present: no) are
# delete. bilendi_id (delete_after_billing) is delete: the synthetic data
# have no billing to wait for. Every questionnaire column is keep, including
# Kommentarfeld (internal file only, cfg$free_text_comment). Duration is kept
# as an analysis descriptor, as required by the current AP3 allowlists.
#
# reason: delete_always / delete_if_present / delete_after_billing / keep;
# present: whether the column exists in the export; in_schema: whether it is
# part of the export schema (R/io_qualtrics.R, zm_raw_schema).

