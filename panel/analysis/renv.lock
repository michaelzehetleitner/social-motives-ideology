      "Description": "Functions for an assortment of factor analysis-related procedures, including eleven procedures for determining the number of  factors; for factor analysis with multiple options for methods of extraction  and rotation; for bifactor analysis; for extension factor analysis;  options for running the analyses using either raw data or correlation matrices as input and with options  for conducting the analyses using Pearson correlations,  Kendall correlations, Spearman correlations, gamma correlations, or polychoric  correlations; wrapper 'lavaan'-based functions for factorial invariance  and exploratory structural equation modeling;  functions for the factorability of a correlation matrix, for the congruences between factors from different datasets, for the  assessment of local independence, for the assessment of factor solution  complexity, for internal consistency, and for correcting Pearson correlation  coefficients for attenuation due to unreliability. Auerswald & Moshagen (2019, ISSN:1939-1463); Field, Miles, & Field (2012, ISBN:978-1-4462-0045-2); Mulaik (2010, ISBN:978-1-4200-9981-2); O'Connor (2000, <doi:10.3758/bf03200807>); O'Connor (2001, ISSN:0146-6216).",
